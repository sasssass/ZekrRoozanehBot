name: Daily Zekr

on:
  schedule:
    # GitHub cron is always UTC and has no `timezone:` option, so the local
    # send time is decided in Python (Europe/Stockholm, DST-aware).
    # GitHub throttles frequent schedules and can delay runs by hours, so the
    # script catches up on the first run at/after each target hour instead of
    # requiring a run inside one exact hour.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: Send the zikr immediately
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-zekr
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send daily zekr
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.send_now }}
        run: python send_daily_zekr.py

      - name: Save discovered groups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/group_chats.json data/state.json
          git diff --cached --quiet || git commit -m "Update Telegram group list"
          git push
